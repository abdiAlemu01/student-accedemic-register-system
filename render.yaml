services:
  # Backend API Service
  - type: web
    name: sarms-backend
    runtime: node
    rootDir: SARMS/backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /api/health

  # PostgreSQL Database
  - type: pserv
    name: sarms-db
    runtime: postgresql
    plan: free
    databaseName: sarms_db
    databaseUser: sarms_user
